name: Patch Recovery v2 Year 2 grammar fragments A

on:
  push:
    branches: [content/recovery-v2-year2-grammar-fragments-a]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/recovery-v2-year2-grammar-fragments-a
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove reliance on missing Present Perfect time-expression topic
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'content/recovery/curriculum-v2/fragments/year-2-grammar-a.bundle.json';
          let text = fs.readFileSync(path, 'utf8');
          const replacements = [
            ['Tom has already decided and bought the tickets. Which sentence best describes his plan?', 'Tom has a clear plan and the tickets are in his bag. Which sentence best describes his plan?'],
            ['Traduci: «Non ho mai lavorato in un ristorante.»', 'Traduci: «Ho lavorato in un ristorante due volte.»'],
            ['I have never worked in a restaurant.', 'I have worked in a restaurant twice.'],
            ["I've never worked in a restaurant.", "I've worked in a restaurant twice."],
            ['Traduci: «Hai mai provato il sushi?»', 'Traduci: «Hai finito il progetto?»'],
            ['Have you ever tried sushi?', 'Have you finished the project?']
          ];
          for (const [from, to] of replacements) {
            if (!text.includes(from)) throw new Error(`Expected source not found: ${from}`);
            text = text.replace(from, to);
          }
          JSON.parse(text);
          fs.writeFileSync(path, text);
          NODE
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/recovery/curriculum-v2/fragments/year-2-grammar-a.bundle.json
          git commit -m 'content: keep Year 2 fragments within available grammar systems'
          git push origin HEAD:content/recovery-v2-year2-grammar-fragments-a
