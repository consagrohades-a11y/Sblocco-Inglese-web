name: Materialize Recovery v2 Year 2 grammar fragments A

on:
  push:
    branches: [content/recovery-v2-year2-grammar-fragments-a]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/recovery-v2-year2-grammar-fragments-a
      - name: Write canonical source files
        env:
          BUNDLE_GZ_B64: 
          MANIFEST_GZ_B64: 
        run: |
          mkdir -p content/recovery/curriculum-v2/fragments
          printf '%s' "$BUNDLE_GZ_B64" | base64 -d | gzip -d > content/recovery/curriculum-v2/fragments/year-2-grammar-a.bundle.json
          printf '%s' "$MANIFEST_GZ_B64" | base64 -d | gzip -d > content/recovery/curriculum-v2/fragments/year-2-grammar-a.fragments.json
          node -e "JSON.parse(require('fs').readFileSync('content/recovery/curriculum-v2/fragments/year-2-grammar-a.bundle.json','utf8')); JSON.parse(require('fs').readFileSync('content/recovery/curriculum-v2/fragments/year-2-grammar-a.fragments.json','utf8'))"
      - name: Commit generated source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/recovery/curriculum-v2/fragments/year-2-grammar-a.bundle.json content/recovery/curriculum-v2/fragments/year-2-grammar-a.fragments.json
          git commit -m 'content: add first Year 2 cumulative grammar fragments'
          git push origin HEAD:content/recovery-v2-year2-grammar-fragments-a
