name: Temporary Wave 2 PR A transfer

on:
  push:
    branches:
      - content/recovery-wave2-grammar-nouns-pr-a

permissions:
  contents: write

jobs:
  transfer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy only PR A Recovery content from source branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin content/recovery-wave2-grammar-nouns:refs/remotes/origin/source-wave2
          git checkout origin/source-wave2 -- \
            content/recovery/briefs/comparatives.lesson-brief.json \
            content/recovery/briefs/superlatives.lesson-brief.json \
            content/recovery/briefs/modal-verbs.lesson-brief.json \
            content/recovery/wave-2/comparatives.bundle.json \
            content/recovery/wave-2/superlatives.bundle.json \
            content/recovery/wave-2/modal-verbs.bundle.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/recovery/briefs content/recovery/wave-2
          git rm .github/workflows/wave2-pr-a-transfer.yml
          git commit -m 'content: add Recovery Wave 2 comparatives superlatives and modals'
          git push origin HEAD:content/recovery-wave2-grammar-nouns-pr-a
