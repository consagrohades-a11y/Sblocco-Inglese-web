name: Mark Recovery prerequisite alignment applied

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mark-recovery-prerequisites-applied.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'content/recovery-curriculum-v2-prerequisite-alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Mark definitive plan alignment applied
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'content/recovery/curriculum-v2/gap-analysis.json';
          const plan = JSON.parse(fs.readFileSync(path, 'utf8'));
          plan.cross_year_prerequisite_alignment.status = 'applied';
          fs.writeFileSync(path, `${JSON.stringify(plan, null, 2)}\n`);
          NODE
      - name: Commit plan status
        run: |
          if git diff --quiet -- content/recovery/curriculum-v2/gap-analysis.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/recovery/curriculum-v2/gap-analysis.json
          git commit -m 'plan: mark Curriculum v2 prerequisite alignment applied'
          git push origin HEAD:${{ github.head_ref }}
