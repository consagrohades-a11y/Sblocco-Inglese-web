name: Temporary Wave 2 materializer

on:
  push:
    branches:
      - content/recovery-wave2-grammar-nouns

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble final Recovery bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/recovery/wave-2
          cat .wave2-temp/comparatives.part* > content/recovery/wave-2/comparatives.bundle.json
          cat .wave2-temp/superlatives.part* > content/recovery/wave-2/superlatives.bundle.json
          cat .wave2-temp/modal-verbs.part* > content/recovery/wave-2/modal-verbs.bundle.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const topic of ['comparatives', 'superlatives', 'modal-verbs']) {
            const path = `content/recovery/wave-2/${topic}.bundle.json`;
            const parsed = JSON.parse(readFileSync(path, 'utf8'));
            if (parsed.schema_version !== 2 || parsed.entity_type !== 'bundle' || parsed.exercises?.length !== 4) {
              throw new Error(`${topic}: assembled bundle contract is invalid`);
            }
          }
          NODE

      - name: Commit clean final files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/recovery/wave-2/*.bundle.json
          git rm -r .wave2-temp
          git rm .github/workflows/wave2-materialize.yml
          git commit -m 'content: materialize Recovery Wave 2 PR A bundles'
          git push origin HEAD:content/recovery-wave2-grammar-nouns
