name: Recovery Wave 1 artifact

on:
  push:
    branches:
      - ops/recovery-wave1-artifact

permissions:
  contents: write

jobs:
  patch-feature:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ops helper
        uses: actions/checkout@v4
        with:
          path: ops
      - name: Checkout target feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/recovery-wave1-one-click-publish
          path: target
      - name: Apply explicit Wave 1 publish patch
        run: |
          cp ops/scripts/ops-patch-recovery-wave1-publish.py target/scripts/ops-patch-recovery-wave1-publish.py
          cd target
          python scripts/ops-patch-recovery-wave1-publish.py
          rm scripts/ops-patch-recovery-wave1-publish.py
          git diff --check
          git status --short
      - name: Commit feature changes
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminRecoveryContent.jsx scripts/validate-recovery-wave-publish.mjs package.json
          git commit -m "feat: publish validated Recovery Wave 1 from admin"
          git push origin HEAD:feat/recovery-wave1-one-click-publish
