name: Temporary Wave 2 PR B transfer

on:
  push:
    branches:
      - content/recovery-wave2-quantifiers-pr-b

permissions:
  contents: write

jobs:
  transfer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy only PR B Recovery content
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin content/recovery-wave2-quantifiers:refs/remotes/origin/source-wave2-pr-b
          git checkout origin/source-wave2-pr-b -- \
            content/recovery/briefs/countable-uncountable.lesson-brief.json \
            content/recovery/briefs/some-any.lesson-brief.json \
            content/recovery/briefs/much-many-a-lot-of.lesson-brief.json \
            content/recovery/wave-2/countable-uncountable.bundle.json \
            content/recovery/wave-2/some-any.bundle.json \
            content/recovery/wave-2/much-many-a-lot-of.bundle.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/recovery/briefs content/recovery/wave-2
          git rm .github/workflows/wave2-prb-transfer.yml
          git commit -m 'content: add Recovery Wave 2 countability and quantifiers'
          git push origin HEAD:content/recovery-wave2-quantifiers-pr-b
