name: Recovery verification v2

on:
  pull_request:
    paths:
      - 'content/recovery/verification-v2/**'
      - 'scripts/validate-recovery-verification-v2.mjs'
      - '.github/workflows/recovery-verification-v2.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/validate-recovery-verification-v2.mjs
