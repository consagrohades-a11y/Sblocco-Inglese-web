name: Apply Recovery Curriculum v2 prerequisites

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-recovery-curriculum-v2-prerequisite-alignment.mjs'
      - '.github/workflows/apply-recovery-curriculum-v2-prerequisites.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'content/recovery-curriculum-v2-prerequisite-alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply prerequisite recommendations
        run: node scripts/apply-recovery-curriculum-v2-prerequisite-alignment.mjs
      - name: Commit aligned year files
        run: |
          if git diff --quiet -- content/recovery/curriculum-v2/years/year-2.json content/recovery/curriculum-v2/years/year-3.json; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/recovery/curriculum-v2/years/year-2.json content/recovery/curriculum-v2/years/year-3.json
          git commit -m 'content: align Curriculum v2 cross-year prerequisites'
          git push origin HEAD:${{ github.head_ref }}
