    <title>Sblocco Inglese | Impara l’inglese partendo da ciò che vuoi farci</title>
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('sblocco_theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark && window.location.pathname !== '/') {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          /* tema di default chiaro se localStorage non è accessibile */
        }
      })();
    </script>
